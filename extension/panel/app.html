<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Delta Drills</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #14161a;
        overflow: hidden;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <!-- This page is the whole side panel, and it is deliberately nothing but a
         frame. The panel shows the real delta-drills.vercel.app — its own tab
         bar, its own Google sign-in, its own everything. There is no panel UI to
         maintain, and nothing here to drift out of sync with the site.

         Why a frame at all: MV3 only accepts an extension-relative path for
         `side_panel.default_path`, so a local page holding the site is the only
         way to put a live website in a Chrome side panel.

         `identity-credentials-get` is load-bearing. Sign in with Google now
         negotiates over FedCM, and FedCM inside a cross-origin frame is denied
         unless the embedder grants it through Permissions Policy — without this
         attribute the button renders and then fails. `publickey-credentials-get`
         covers the passkey path Google falls back to.

         Do not add a toolbar, a settings sheet or any other chrome to this file.
         The site has navigation; a second set competes with it. -->
    <iframe
      src="https://delta-drills.vercel.app/"
      title="Delta Drills"
      allow="identity-credentials-get; publickey-credentials-get; clipboard-read; clipboard-write; fullscreen"
    ></iframe>
  </body>
</html>
