app = "delta-drills-backend"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  STORAGE_DIR = "/data/storage"
  USER_DATA_DIR = "/data/user_data"
  # AI question repairs written at runtime by the feedback loop. On the volume,
  # not in the image — the image's chatgpt/ tree is rebuilt on every deploy, so
  # keeping them there would silently revert every fix since the last deploy.
  DELTA_FEEDBACK_AI_DIR = "/data/ai_feedback"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "20s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"
  [http_service.checks.headers]
    X-Forwarded-Proto = "https"

[[mounts]]
  source = "delta_drills_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  # 2GB: torch (cpu wheel) stays preimported in the API process so the fork
  # runner can grade torch drills in-process. 512mb OOM'd on torch import.
  memory = "2gb"
